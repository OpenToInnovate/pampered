# Veterinary providers, and the sponsorship promise.
#
# One entry per brand a visitor might be registered with. `match` is the list of
# case-insensitive fragments looked for in an OpenStreetMap vet's brand, name or
# operator. A practice is assigned to the first provider whose fragment matches,
# in this file's order, so keep the more specific fragments above the general
# ones (Companion Care before Vets4Pets, for example).
#
# Every entry is `confirmed: false` until the provider (or the sponsor) has
# signed off the name, the colour, the links and the logo. `npm run check`
# warns about unconfirmed entries rather than failing, so the site can be built
# and reviewed; do not publish a sponsor card for an unconfirmed entry.
#
# `colour` is used only for the sponsor card's wordmark and accent — never for
# the map, the chips or the rest of the interface. It must reach 4.5:1 against
# white, because the wordmark is text. `logo` is a path under `public/` and is
# null until the provider supplies a file we may use.
#
# Sponsorship policy, enforced by the build and stated on /about:
#   - the card always says "Sponsored by {name}";
#   - a sponsor's practices are never ranked above anyone else's.

version: 1
policy:
  disclosure: Sponsored by
  ranking: Sponsor practices never rank above non-sponsors in search or lists.

vets:
  # ------------------------------------------------------------ our own vet
  # The provider Pampered's team uses, and the first sponsor. The colour is the
  # brand's own theme colour (#F3E9FD); the card derives a readable ink from it
  # rather than darkening the brand into something it is not.
  - id: creature-comforts
    name: Creature Comforts Vets
    colour: "#F3E9FD"
    logo: null
    plan_url: https://www.creaturecomforts.co.uk/memberships
    website: https://www.creaturecomforts.co.uk/
    match: [creature comforts]
    # Their group's branches all carry operator=Creature Comforts. A bare name
    # is not enough: another practice called "Creature Comforts" exists that is
    # not one of theirs.
    match_names: false
    sponsor: true
    confirmed: false
    # A rating from the team that runs this site, not from a review site. The UI
    # labels it "Rated by Pampered" so it is never mistaken for the details score.
    rating: 5
    rating_note: Rated by Pampered — our own vet
    note: Light purple brand; membership plans are on their site.

